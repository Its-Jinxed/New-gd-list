
name: Generate List History

on:
  push:
    branches:
      - main
    paths:
      - 'data/_list.json'
      - 'data/_legacy.json'
      - 'scripts/generate-history.py'
      - '.github/workflows/history.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: list-history
  cancel-in-progress: false

jobs:
  generate-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate historical snapshots
        run: python scripts/generate-history.py

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/_positionHistory.json

          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "Automatically update list history"
            git push origin main
          fi
