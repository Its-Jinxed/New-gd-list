
name: Deploy Main and Dev to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-site

      - name: Checkout dev branch
        uses: actions/checkout@v6
        with:
          ref: dev
          path: dev-site

      - name: Prepare website
        run: |
          mkdir -p _site/dev

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='/dev/' \
            main-site/ _site/

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            dev-site/ _site/dev/

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
